[package]
name = "mucellit"
version = "1.0.0"
description = "Mücellit: a bookbinding tool (Mac app)"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "mucellit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# Security-scoped bookmarks (Open Recent). The version is pinned: a single-developer, single-version crate.
# It builds outside Apple too and returns Error::Unsupported (recent.rs falls back to the plain path); no cfg needed.
apple-scoped-bookmarks = "=0.1.0"
# Interface language: the macOS preferred languages (NSLocale.preferredLanguages); the version is the same as tao/wry (Cargo.lock).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSEnumerator", "NSError", "NSGeometry", "NSLocale", "NSObject", "NSString", "NSURL"] }
# Printing: a PDFKit print operation (100% scale) and Open in Preview. The versions are the same as the objc2 0.6 / 0.3
# family that tao/wry use (Cargo.lock); objc2-pdf-kit is a new crate (the same author, the same family).
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "PDFDocument", "PDFPage", "objc2-app-kit", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }

#: a mock runtime (tauri::test) to test the IPC commands with the real command wrapper.
# Active only in the tests (resolver 2: a feature of a dev dependency does not reach the release build); no new crate.
[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }

#: the panel-less print-to-PDF measurement (`tests/print_pdf.rs`) writes the save URL into the NSPrintInfo dictionary.
# Only in the test (resolver 2: does not reach the release build); the same crate (Cargo.lock), only a feature.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary"] }

# The print operation needs the main thread: the test runs in its own main (instead of a libtest thread).
[[test]]
name = "print_pdf"
harness = false

# tauri-plugin-updater is left out on purpose (the app does not update itself); the devtools feature is off in release.

[profile.release]
codegen-units = 1
lto = true
strip = true
